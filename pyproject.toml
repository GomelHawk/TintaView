[build-system]
# setuptools>=77 for PEP 639: `license` as an SPDX expression plus `license-files`.
# Older setuptools rejects the string form outright rather than ignoring it.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tintaview"
dynamic = ["version"]
description = "Agent-status lighting and usage tray for Claude Code, Codex CLI and Cursor"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

# The core (status broker + hooks + engines) is deliberately stdlib-only apart from
# tomlkit: it has to run on a bare WSL distro without dragging in a compiler toolchain,
# and it is what a `--headless` install gets. Anything heavier is an extra.
dependencies = ["tomlkit>=0.12"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
openrgb = ["openrgb-python>=0.3.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pillow>=10", "numpy>=1.26"]

[project.scripts]
tintaview = "tintaview.cli:main"

[tool.setuptools.packages.find]
include = ["tintaview*"]

# Version comes from the git tag (vX.Y.Z), not a hand-edited string here or in
# tintaview/__init__.py -- tagging a release IS the version bump. version_file is
# regenerated by every build and is gitignored.
[tool.setuptools_scm]
version_file = "tintaview/_version.py"

[tool.setuptools.package-data]
tintaview = ["hooks/*", "assets/generated/*"]
# Interface translations, read at runtime via importlib.resources. Its own entry
# because the glob is relative to the package that owns the files, and these live in
# tintaview.i18n, not tintaview. tests/test_i18n.py guards this line: without it the
# wheel installs with no catalogues and every language silently falls back to English.
"tintaview.i18n" = ["locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

# Type-checked: `core/` and `engines/` only — the two stdlib-only packages, and the two
# whose trickiest invariant a checker can actually hold. Every PySide6 and openrgb import
# in them must stay *optional at runtime* (a headless install has neither), which is
# exactly the kind of rule a refactor breaks by hoisting an import to module scope.
# `ui/` is deliberately out of scope: it is Qt end to end, and PySide6's generated stubs
# would make the run about Qt's typing rather than about TintaView's.
[tool.mypy]
python_version = "3.12"
files = ["tintaview/core", "tintaview/engines"]
# The bar is "no new untyped holes", not full strictness: this is a codebase with
# deliberate `Any` at every vendor-SDK boundary (ctypes DLLs, an openrgb client that may
# not be installed), and demanding annotations there would only produce noise.
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true

# Optional at runtime and not installed in the lint job — the engine is skipped when the
# import fails, which is the behaviour `engines/openrgb.py` is written around.
[[tool.mypy.overrides]]
module = ["openrgb.*"]
ignore_missing_imports = true
