name: Build release artifacts

# Builds the distribution and attaches to the GitHub Release for a `vX.Y.Z` tag:
#
#   tintaview-<version>-py3-none-any.whl   the wheel both installers pip-install
#   tintaview-<version>.tar.gz             the sdist, for anyone building from source
#   install.ps1                            the Windows installer/updater
#   install.sh                             the Linux/macOS installer/updater
#   SHA256SUMS.txt                         checksums for all of the above
#
# There is deliberately **no compiled bundle and no .exe installer** (see AGENTS.md, "Packaging").
# Windows has two independent defences against unsigned software and a frozen binary loses
# to both: Mark-of-the-Web gets a browser-downloaded installer blocked on reputation and
# then by SmartScreen, and Smart App Control refuses to run any executable that is neither
# signed nor cloud-reputable — which a freshly built, byte-unique PyInstaller bundle can
# never become, since every release rebuilds it. Installing a wheel into a virtual
# environment sidesteps both: the only executables involved are the PSF-signed interpreter
# and widely-mirrored PyPI wheels.
#
# The wheel is pure Python, so this needs no Windows runner and no matrix — one ubuntu job
# produces the artifact every platform installs. Building on Linux also keeps `install.sh`
# byte-identical to the repo copy; a windows-latest checkout would rewrite it to CRLF and
# ship a shell script that will not run (see .gitattributes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # needed to attach files to the Release on a tag push

# Unlike ci.yml, `cancel-in-progress: false`: this job publishes release artifacts, and a
# half-finished upload cancelled by a second tag push leaves a Release with some of its
# files on it. Queue them instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The test run below constructs real QWidgets; see ci.yml for why offscreen.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm derives the version from `git describe --tags`, which needs
          # the tag history available locally -- a shallow (depth-1) checkout leaves
          # tags unfetched and the version falls back to a "0.1.dev0+unknown" guess.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Ubuntu's runner image is missing the shared libraries PySide6's QtGui loads
      # unconditionally, even under the offscreen platform plugin. Same list as ci.yml.
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # A tag push does not go through ci.yml's pull_request trigger, so without this a
      # red suite could still be published to a GitHub Release — and a release is the one
      # artifact that cannot be quietly fixed afterwards. Runs before the build so the
      # failure is about the code, not about packaging.
      - name: Test (pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"
          pytest -q

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel installs and imports cleanly
        run: |
          set -eu
          python -m venv /tmp/smoke
          # Without the [ui] extra on purpose: the headless install path must work on a
          # box with no Qt, and this is the cheapest place to catch a regression in it.
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import tintaview; print('imported', tintaview.__version__)"
          # `python -m tintaview` is what the Windows Startup shortcut runs, so a missing
          # __main__.py would break autostart for every Windows user and nothing else.
          /tmp/smoke/bin/python -m tintaview --version

      - name: Check the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          built_version="$(/tmp/smoke/bin/python -c 'import tintaview; print(tintaview.__version__)')"
          if [ "$tag_version" != "$built_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version setuptools-scm derived ($built_version) -- checkout may be shallow or the tag isn't on this commit." >&2
            exit 1
          fi

      - name: Stage release files and compute checksums
        run: |
          set -eu
          mkdir -p dist/release
          cp dist/*.whl dist/*.tar.gz dist/release/
          cp packaging/install.ps1 dist/release/
          cp packaging/install.sh dist/release/
          ( cd dist/release && sha256sum * > SHA256SUMS.txt )
          cat dist/release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tintaview-${{ github.ref_name }}
          path: dist/release/*
          # These files are also attached permanently to the GitHub Release below;
          # the workflow-artifact copy is only useful for the few days after a run,
          # e.g. to inspect a workflow_dispatch build before it's tagged. Left at the
          # default 90 days, they pile up (14+ tags so far) and blow the account's
          # Actions storage cap.
          retention-days: 3

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to a commit SHA, not a tag: a tag is mutable, so `@v3` is an
        # unreviewed third-party action with `contents: write` on this repo, running
        # whatever that tag points at on the day. Dependabot (.github/dependabot.yml)
        # moves the pin.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/release/*
