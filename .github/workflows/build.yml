name: Build release artifacts

# Builds the distribution and attaches to the GitHub Release for a `vX.Y.Z` tag:
#
#   tintaview-<version>-py3-none-any.whl   the wheel both installers pip-install
#   tintaview-<version>.tar.gz             the sdist, for anyone building from source
#   install.ps1                            the Windows installer/updater
#   install.sh                             the Linux/macOS installer/updater
#   SHA256SUMS.txt                         checksums for all of the above
#
# There is deliberately **no compiled bundle and no .exe installer** (see AGENTS.md, "Packaging").
# Windows has two independent defences against unsigned software and a frozen binary loses
# to both: Mark-of-the-Web gets a browser-downloaded installer blocked on reputation and
# then by SmartScreen, and Smart App Control refuses to run any executable that is neither
# signed nor cloud-reputable — which a freshly built, byte-unique PyInstaller bundle can
# never become, since every release rebuilds it. Installing a wheel into a virtual
# environment sidesteps both: the only executables involved are the PSF-signed interpreter
# and widely-mirrored PyPI wheels.
#
# The wheel is pure Python, so this needs no Windows runner and no matrix — one ubuntu job
# produces the artifact every platform installs. Building on Linux also keeps `install.sh`
# byte-identical to the repo copy; a windows-latest checkout would rewrite it to CRLF and
# ship a shell script that will not run (see .gitattributes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Read-only for everything that runs code from the repository or from PyPI (the tests,
# the build). Only the `publish` job below — which runs nothing but the two release
# actions on files already built — may write to the Release.
permissions:
  contents: read

# Unlike ci.yml, `cancel-in-progress: false`: this job publishes release artifacts, and a
# half-finished upload cancelled by a second tag push leaves a Release with some of its
# files on it. Queue them instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Four jobs, split by what each is allowed to touch:
  #
  #   test     runs the suite — with pytest, ruff, pillow, numpy and everything they pull
  #            in, all unpinned. It produces nothing the release uses.
  #   build    builds the wheel in a clean checkout with *only* the pinned, hashed tools
  #            in packaging/build-requirements.txt, and checksums the release files.
  #   verify   installs the built wheel and runs it. It works on a downloaded copy and
  #            uploads nothing.
  #   publish  attests and uploads exactly what `build` produced.
  #
  # They used to be one job. The test tooling then ran in the same workspace, minutes
  # before the wheel was built and SHA256SUMS.txt written, so one compromised release of
  # any test dependency could have changed the wheel or an install script before it was
  # hashed — and the provenance attestation would have vouched for the result.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The test run below constructs real QWidgets; see ci.yml for why offscreen.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Ubuntu's runner image is missing the shared libraries PySide6's QtGui loads
      # unconditionally, even under the offscreen platform plugin. Same list as ci.yml.
      - name: Install Qt runtime dependencies
        run: |
          # `apt-get update` only *warns* when the mirror can't be reached (exit 0) and the
          # install then fails with "Unable to locate package": retry the pair, not just a
          # download. Seen once: "Could not resolve 'archive.ubuntu.com'" in one run.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
                && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3; then
              break
            fi
            [ "$attempt" -lt 5 ] || exit 1
            echo "apt attempt $attempt failed; retrying in 20 s"; sleep 20
          done

      # A tag push does not go through ci.yml's pull_request trigger, so without this a
      # red suite could still be published to a GitHub Release — and a release is the one
      # artifact that cannot be quietly fixed afterwards.
      - name: Test (pytest)
        run: |
          python -m pip install -e ".[dev,ui]"
          pytest -q

      # A release never ships a pin with a published vulnerability.
      - name: Audit the pinned dependencies for known vulnerabilities
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --require-hashes --disable-pip -r packaging/requirements-lock.txt
          pip-audit --require-hashes --disable-pip -r packaging/requirements-headless-lock.txt
          pip-audit --require-hashes --disable-pip -r packaging/build-requirements.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from `git describe --tags`, which needs
          # the tag history available locally -- a shallow (depth-1) checkout leaves
          # tags unfetched and the version falls back to a "0.1.dev0+unknown" guess.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The only packages this job installs: the build tools, each pinned to one version
      # and checked against the SHA-256 in the committed file. `--no-isolation` below
      # makes `build` use exactly these instead of fetching its own, unpinned, copies.
      - name: Install the pinned build tools
        run: |
          python -I -m pip install --require-hashes --only-binary :all: -r packaging/build-requirements.txt

      - name: Build the wheel and sdist
        run: python -I -m build --no-isolation

      # From the file name, without installing anything in this job.
      - name: Check the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          wheel="dist/tintaview-${tag_version}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version setuptools-scm derived ($(ls dist)) -- checkout may be shallow or the tag isn't on this commit." >&2
            exit 1
          fi

      - name: Stage release files and compute checksums
        run: |
          set -eu
          mkdir -p dist/release
          cp dist/*.whl dist/*.tar.gz dist/release/
          cp packaging/install.ps1 dist/release/
          cp packaging/install.sh dist/release/
          # The dependency locks both installers hand to `pip install --require-hashes`:
          # every dependency pinned, with the SHA-256 of its files. The committed files,
          # as they are — regenerating them here moved the pins at every release, and
          # every user's update then re-downloaded Qt. Copied before the checksums so
          # SHA256SUMS.txt covers them.
          cp packaging/requirements-lock.txt packaging/requirements-headless-lock.txt dist/release/
          ( cd dist/release && sha256sum -- * > SHA256SUMS.txt )
          cat dist/release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tintaview-${{ github.ref_name }}
          # Deliberately not `dist/release/*`: the sdist is left out. The publish job
          # attaches it permanently to the Release -- which is free, does not count
          # against Actions storage, and is where every download actually comes from.
          # This copy exists only to eyeball a workflow_dispatch build before it is
          # tagged, and you do that by installing the wheel, never by reading the
          # tarball. SHA256SUMS.txt is generated above from the full `dist/release/*`
          # and stays byte-identical to the Release's copy, so it still lists a
          # .tar.gz that is not in this zip; harmless, nothing verifies this zip.
          path: |
            dist/release/*.whl
            dist/release/install.*
            dist/release/requirements-*.txt
            dist/release/SHA256SUMS.txt
          # Matches the repo-wide artifact-and-log retention (Settings -> Actions).
          # At the 90-day default these piled up one per tag and ate the account's
          # Actions storage allowance for files nobody opens after the day they build.
          retention-days: 3

      # Everything the Release gets, handed to the jobs below: `verify` checks it and
      # `publish` uploads it. One day is plenty — both read it minutes later.
      - name: Hand the release files to the next jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist/release

      - name: Check the wheel installs and imports cleanly
        run: |
          set -eu
          ( cd dist/release && sha256sum -c SHA256SUMS.txt )
          python -m venv /tmp/smoke
          # Without the [ui] extra on purpose: the headless install path must work on a
          # box with no Qt, and this is the cheapest place to catch a regression in it.
          # From the release's own lock, the way the installers do it.
          /tmp/smoke/bin/python -I -m pip install --quiet --require-hashes --only-binary :all: -r dist/release/requirements-headless-lock.txt
          /tmp/smoke/bin/python -I -m pip install --quiet --no-deps dist/release/*.whl
          /tmp/smoke/bin/python -I -c "import tintaview; print('imported', tintaview.__version__)"
          # `python -m tintaview` is what the Windows Startup shortcut runs, so a missing
          # __main__.py would break autostart for every Windows user and nothing else.
          /tmp/smoke/bin/python -P -m tintaview --version

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach files to the Release
      id-token: write # sign the provenance attestation below
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist/release

      # The checksums file is published beside the files it covers, so on its own it only
      # catches a corrupted download. This records, signed by GitHub and outside the
      # Release, that these exact files were built by this workflow from this commit:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/release/*

      - name: Attach to GitHub Release
        # Pinned to a commit SHA, not a tag: a tag is mutable, so `@v3` is an
        # unreviewed third-party action with `contents: write` on this repo, running
        # whatever that tag points at on the day. Dependabot (.github/dependabot.yml)
        # moves the pin.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/release/*
